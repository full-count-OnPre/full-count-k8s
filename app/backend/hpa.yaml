apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: full-count-api
  namespace: app
  labels:
    app.kubernetes.io/name: full-count-api
    app.kubernetes.io/part-of: full-count
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: full-count-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
