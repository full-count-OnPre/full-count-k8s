  COLLECTOR_INTERVAL: "300"
  REDIS_HOST: "redis-service.data.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgresql-service.db.svc.cluster.local" # 여기 수정!
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fullcount"