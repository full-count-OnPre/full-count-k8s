apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlb-collector
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: mlb-collector
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mlb-collector
              image: YOUR_COLLECTOR_IMAGE:latest
              envFrom:
                - configMapRef:
                    name: collector-config
                - secretRef:
                    name: postgresql-secret