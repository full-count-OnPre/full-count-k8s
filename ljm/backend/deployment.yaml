apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-count-api
  namespace: app
  labels:
    app.kubernetes.io/name: full-count-api
    app.kubernetes.io/part-of: full-count
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: full-count-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: full-count-api
        app.kubernetes.io/part-of: full-count
    spec:
      nodeSelector:
        role: app
      containers:
        - name: api
          image: javor10/fullcount-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: fullcount-config
            - secretRef:
                name: fullcount-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fullcount-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
