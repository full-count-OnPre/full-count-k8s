apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-count-front
  namespace: app
  labels:
    app.kubernetes.io/name: full-count-front
    app.kubernetes.io/part-of: full-count
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: full-count-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: full-count-front
        app.kubernetes.io/part-of: full-count
    spec:
      nodeSelector:
        role: app
      containers:
        - name: frontend
          image: shimdongseup/full-count-front:tagname
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: full-count-front-config
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
