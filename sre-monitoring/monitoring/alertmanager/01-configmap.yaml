apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: full-count-monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default-webhook
      group_by: ["alertname", "job", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: critical-webhook

    receivers:
      - name: default-webhook
        webhook_configs:
          - url: http://placeholder-warning-webhook.monitoring.svc.cluster.local/alerts
            send_resolved: true

      - name: critical-webhook
        webhook_configs:
          - url: http://placeholder-critical-webhook.monitoring.svc.cluster.local/alerts
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ["alertname", "job"]
