apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: full-count-monitoring
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: full-count-default
        orgId: 1
        folder: Full Count
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
