apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: full-count-monitoring
data:
  general-alerts.yaml: |
    groups:
      - name: full-count-general
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: warning
              team: sre
            annotations:
              summary: "Prometheus scrape target down"
              description: "Target {{ $labels.instance }} in job {{ $labels.job }} has been down for more than 2 minutes."

          - alert: PrometheusHighMemoryUsage
            expr: process_resident_memory_bytes{job="prometheus"} > 1073741824
            for: 5m
            labels:
              severity: warning
              team: sre
            annotations:
              summary: "Prometheus memory usage is high"
              description: "Prometheus resident memory is above 1GiB for more than 5 minutes."

          - alert: AlertmanagerDown
            expr: up{job="alertmanager"} == 0
            for: 2m
            labels:
              severity: critical
              team: sre
            annotations:
              summary: "Alertmanager is unreachable"
              description: "Prometheus cannot reach Alertmanager on alertmanager.monitoring.svc.cluster.local:9093."

          - alert: KubernetesAPIServerDown
            expr: up{job="kubernetes-apiservers"} == 0
            for: 2m
            labels:
              severity: critical
              team: sre
            annotations:
              summary: "Kubernetes API server target down"
              description: "The Kubernetes API server endpoint has not been reachable for more than 2 minutes."
